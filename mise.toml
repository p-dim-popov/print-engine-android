# Host build tools. shellcheck, ruff and actionlint check the scripts, the
# tests and the CI workflow. The host also needs a C compiler and Python 3.
[tools]
cmake = "4.4.4"
ninja = "1.13.2"
shellcheck = "0.11.0"
ruff = "0.17.4"
actionlint = "1.7.12"

[env]
# The Android SDK: a preset location is kept (CI runners have one), else ~/Android/Sdk.
# The NDK build needs its ndk/<version>; the emulator check needs its adb.
ANDROID_HOME = "{{ get_env(name='ANDROID_HOME', default=env.HOME ~ '/Android/Sdk') }}"
_.path = ["{{ env.ANDROID_HOME }}/platform-tools"]

# `mise tasks` lists these; `mise run <name>` runs one with the tools above on the PATH.
# Each mise task runs the ones it needs first, so any of them can run on its own.

[tasks.configure]
description = "Configure the host build in build/"
run = "cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release"

[tasks.build]
description = "Build libgutenprint, the program and Gutenprint's data (build/data)"
depends = ["configure"]
run = "cmake --build build"

[tasks.test]
description = "Run the host tests (the program's interface, golden jobs, upstream's data check)"
depends = ["build"]
run = "ctest --test-dir build --output-on-failure"

[tasks.guards]
description = "Run the licence guard: every new source file carries the GPL notice"
run = "scripts/check-licence-notices.sh"

[tasks.lint]
description = "Run shellcheck on the scripts, ruff on the Python files and actionlint on the CI workflow; any finding fails"
run = ["shellcheck scripts/*.sh", "ruff check scripts tests", "actionlint"]

[tasks.android]
description = "Build the program with the NDK for arm64-v8a and x86_64 (build-android/<abi>/libprintengine.so) and check API level 26 and 16 KB pages"
run = "scripts/build-android.sh"

[tasks.emulator]
description = "Run the x86_64 program on the emulator ANDROID_SERIAL names and compare its job with the golden job; refuses a device that is not an x86_64 emulator"
depends = ["build"]
run = ["scripts/build-android.sh x86_64", "scripts/emulator-check.sh"]

# The steps of .github/workflows/ci.yml, in the same order. The emulator check is not one: CI has no emulator.
[tasks.ci]
description = "Run every CI step in order: lint, configure, build, test, guards (the host job), then android (the NDK job)"
run = [{ task = "lint" }, { task = "configure" }, { task = "build" }, { task = "test" }, { task = "guards" }, { task = "android" }]
