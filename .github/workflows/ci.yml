name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    # A run takes a few minutes; a hang fails here, not at the 6-hour job limit.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Installs the tool versions pinned in mise.toml. Each step below is a mise
      # task from mise.toml; `mise run ci` runs the same steps locally.
      - uses: jdx/mise-action@v5

      - name: Lint the scripts, the tests and this workflow
        run: mise run lint

      - name: Configure
        run: mise run configure

      - name: Build (libgutenprint, the program, Gutenprint's data)
        run: mise run build

      - name: Host tests (interface, golden MP250 job, coverage, upstream's data check)
        run: mise run test

      - name: Licence guard (notices in this repository's source files)
        run: mise run guards

  android:
    runs-on: ubuntu-latest
    # The NDK download and two builds take a few minutes.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # The runner's SDK has other NDK versions; install the one
      # android/build.gradle.kts names.
      - name: Install the NDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$(scripts/build-android.sh --ndk-version)" > /dev/null

      - name: NDK build (arm64-v8a, x86_64), API level 26 and 16 KB pages checked
        run: mise run android
